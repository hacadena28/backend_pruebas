name: Backend CI Pipeline

on:
  push:
    branches: [ "develop", "qa", "main" ]
  pull_request:
    branches: [ "develop", "qa", "main" ]

jobs:
  build-and-unit-tests:
    name: Build & Unit Tests
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Use the version matching your project

      - name: Restore dependencies
        run: dotnet restore VehicleManagement.slnx

      - name: Build
        run: dotnet build VehicleManagement.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test VehicleManagement.slnx --no-build --configuration Release --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat=opencover --logger trx --results-directory "TestResults"

      - name: Upload Unit Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-test-results
          path: TestResults/
          retention-days: 10

  mutation-tests:
    name: Mutation Testing (Stryker)
    runs-on: self-hosted
    needs: build-and-unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Stryker
        run: dotnet tool install -g dotnet-stryker

      - name: Run Stryker
        run: dotnet stryker
        working-directory: VehicleManagement.Test # Or the folder containing tests

      - name: Upload Mutation Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-mutation-report
          path: VehicleManagement.Test/StrykerOutput/
          retention-days: 10

  sonarqube:
    name: SonarQube Analysis
    runs-on: self-hosted
    needs: build-and-unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java (Required for SonarScanner)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage

      - name: Analyze with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "http://localhost:9000"
        run: |
          dotnet sonarscanner begin /k:"VehicleManagement.Backend" /d:sonar.host.url="${{ env.SONAR_HOST_URL }}" /d:sonar.token="${{ env.SONAR_TOKEN }}" /d:sonar.cs.vscoveragexml.reportsPaths="**/coverage.xml" /d:sonar.cs.vstest.reportsPaths="**/*.trx"
          dotnet build VehicleManagement.slnx --no-incremental --configuration Release
          dotnet-coverage collect "dotnet test VehicleManagement.slnx --no-build --configuration Release --verbosity normal --logger trx" -f xml -o "coverage.xml"
          dotnet sonarscanner end /d:sonar.token="${{ env.SONAR_TOKEN }}"

      - name: Upload Sonar Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-xml
          path: coverage.xml
          retention-days: 10

