name: Backend CI Pipeline

on:
  push:
    branches: [ "develop", "qa", "main" ]
  pull_request:
    branches: [ "develop", "qa", "main" ]

jobs:
  build-test-analyze:
    name: Build, Test & SonarQube
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java (Required for SonarScanner)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Tools
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage

      - name: Restore dependencies
        run: dotnet restore VehicleManagement.slnx

      - name: Analyze with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "http://localhost:9000"
        run: |
          dotnet sonarscanner begin /k:"VehicleManagement.Backend" /d:sonar.host.url="${{ env.SONAR_HOST_URL }}" /d:sonar.token="${{ env.SONAR_TOKEN }}" /d:sonar.cs.vscoveragexml.reportsPaths="**/coverage.xml" /d:sonar.cs.vstest.reportsPaths="**/*.trx"
          dotnet build VehicleManagement.slnx --no-incremental --configuration Release
          dotnet-coverage collect "dotnet test VehicleManagement.slnx --no-build --configuration Release --verbosity normal --logger trx --results-directory TestResults" -f xml -o "coverage.xml"
          dotnet sonarscanner end /d:sonar.token="${{ env.SONAR_TOKEN }}"

      - name: Generate HTML Coverage Report
        run: reportgenerator -reports:coverage.xml -targetdir:CoverageReport -reporttypes:Html

      - name: Upload Backend Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-html
          path: CoverageReport/
          retention-days: 10

      - name: Upload Unit Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-test-results
          path: TestResults/
          retention-days: 10

      - name: Upload Sonar Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-xml
          path: coverage.xml
          retention-days: 10

  mutation-tests:
    name: Mutation Testing (Stryker)
    runs-on: self-hosted
    needs: build-test-analyze
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Stryker
        run: dotnet tool install -g dotnet-stryker

      - name: Run Stryker
        run: dotnet stryker
        working-directory: VehicleManagement.Test

      - name: Upload Mutation Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-mutation-report
          path: VehicleManagement.Test/StrykerOutput/
          retention-days: 10

  performance-tests:
    name: JMeter Performance Tests
    runs-on: self-hosted
    needs: build-test-analyze
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Start MongoDB
        run: docker run -d -p 27018:27017 --name mongodb-test mongo:latest

      - name: Seed Database
        run: |
          Start-Sleep -Seconds 5
          docker exec mongodb-test mongosh VehicleDb --eval "db.User.insertOne({ _id: '1', Email: 'admin@example.com', PasswordHash: 'Admin123!', FullName: 'Admin' })"

      - name: Start API (Docker)
        run: |
          Write-Host "Building API Docker image..."
          docker build -t vehicle-api -f VehicleManagement.Api/Dockerfile .
          
          Write-Host "Starting API container..."
          docker run -d --name backend-api -p 5014:8080 `
            -e MONGODB_CONNECTION_STRING="mongodb://host.docker.internal:27018" `
            -e MONGODB_DATABASE_NAME="VehicleDb" `
            -e JWT_ISSUER="VehicleManagement" `
            -e JWT_AUDIENCE="VehicleManagementUsers" `
            -e JWT_SIGNING_KEY="SuperSecretKeyForVehicleManagementAPI!" `
            vehicle-api
            
          Write-Host "Waiting for container to initialize..."
          Start-Sleep -Seconds 5
          docker logs backend-api
          
      - name: Wait for API
        run: |
          $maxRetries = 60
          $retryCount = 0
          while ($retryCount -lt $maxRetries) {
              $connection = Test-NetConnection -ComputerName localhost -Port 5014 -InformationLevel Quiet
              if ($connection -eq $true) {
                  Write-Host "API is up and listening on port 5014!"
                  break
              }
              Write-Host "Waiting for API to bind to port 5014..."
              Start-Sleep -Seconds 2
              $retryCount++
          }
          if ($retryCount -eq $maxRetries) { 
              Write-Error "Timeout waiting for API"
              docker logs backend-api
              exit 1 
          }

      - name: Run JMeter Tests
        run: |
          (Get-Content run-performance-tests.ps1) -replace 'Start-Process \(Join-Path \$reportDir "index.html"\)', '' | Set-Content run-performance-tests.ps1
          .\run-performance-tests.ps1

      - name: Clean up Containers
        if: always()
        run: |
          docker rm -f mongodb-test
          docker rm -f backend-api

      - name: Upload JMeter Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-jmeter-report
          path: jmeter/report/
          retention-days: 10

