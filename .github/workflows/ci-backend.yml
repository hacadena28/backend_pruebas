name: Backend CI Pipeline

on:
  push:
    branches: [ "dev", "qa", "main" ]
  pull_request:
    branches: [ "dev", "qa", "main" ]

jobs:
  build-and-unit-tests:
    name: Build & Unit Tests
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Use the version matching your project

      - name: Restore dependencies
        run: dotnet restore VehicleManagement.slnx

      - name: Build
        run: dotnet build VehicleManagement.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test VehicleManagement.slnx --no-build --configuration Release --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat=opencover

  mutation-tests:
    name: Mutation Testing (Stryker)
    runs-on: self-hosted
    needs: build-and-unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Stryker
        run: dotnet tool install -g dotnet-stryker

      - name: Run Stryker
        run: dotnet stryker
        working-directory: VehicleManagement.Test # Or the folder containing tests

  sonarqube:
    name: SonarQube Analysis
    runs-on: self-hosted
    needs: build-and-unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java (Required for SonarScanner)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Analyze with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          dotnet sonarscanner begin /k:"VehicleManagement.Backend" /d:sonar.host.url="${{ env.SONAR_HOST_URL }}" /d:sonar.token="${{ env.SONAR_TOKEN }}" /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          dotnet build VehicleManagement.slnx
          dotnet sonarscanner end /d:sonar.token="${{ env.SONAR_TOKEN }}"

  security-owasp:
    name: OWASP Dependency Check
    runs-on: self-hosted
    needs: build-and-unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'VehicleManagement'
          path: '.'
          format: 'HTML'
      - name: Upload OWASP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/dependency-check-report.html
