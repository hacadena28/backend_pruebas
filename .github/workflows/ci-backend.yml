name: Backend CI Pipeline

on:
  push:
    branches: [ "develop", "qa", "main" ]
  pull_request:
    branches: [ "develop", "qa", "main" ]

jobs:
  build-and-unit-tests:
    name: Build & Unit Tests
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Use the version matching your project

      - name: Restore dependencies
        run: dotnet restore VehicleManagement.slnx

      - name: Build
        run: dotnet build VehicleManagement.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test VehicleManagement.slnx --no-build --configuration Release --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat=opencover --logger trx --logger html --results-directory "TestResults"

      - name: Upload Unit Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-test-results
          path: TestResults/
          retention-days: 10

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate Coverage Report
        run: reportgenerator -reports:**/coverage.opencover.xml -targetdir:CoverageReport -reporttypes:Html

      - name: Upload Backend Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-html
          path: CoverageReport/
          retention-days: 10

  mutation-tests:
    name: Mutation Testing (Stryker)
    runs-on: self-hosted
    needs: build-and-unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Stryker
        run: dotnet tool install -g dotnet-stryker

      - name: Run Stryker
        run: dotnet stryker
        working-directory: VehicleManagement.Test # Or the folder containing tests

      - name: Upload Mutation Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-mutation-report
          path: VehicleManagement.Test/StrykerOutput/
          retention-days: 10

  sonarqube:
    name: SonarQube Analysis
    runs-on: self-hosted
    needs: build-and-unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java (Required for SonarScanner)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage

      - name: Analyze with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "http://localhost:9000"
        run: |
          dotnet sonarscanner begin /k:"VehicleManagement.Backend" /d:sonar.host.url="${{ env.SONAR_HOST_URL }}" /d:sonar.token="${{ env.SONAR_TOKEN }}" /d:sonar.cs.vscoveragexml.reportsPaths="**/coverage.xml" /d:sonar.cs.vstest.reportsPaths="**/*.trx"
          dotnet build VehicleManagement.slnx --no-incremental --configuration Release
          dotnet-coverage collect "dotnet test VehicleManagement.slnx --no-build --configuration Release --verbosity normal --logger trx" -f xml -o "coverage.xml"
          dotnet sonarscanner end /d:sonar.token="${{ env.SONAR_TOKEN }}"

      - name: Upload Sonar Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-xml
          path: coverage.xml
          retention-days: 10

  performance-tests:
    name: JMeter Performance Tests
    runs-on: self-hosted
    needs: build-and-unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Start MongoDB
        run: docker run -d -p 27018:27017 --name mongodb-test mongo:latest

      - name: Seed Database
        run: |
          Start-Sleep -Seconds 5
          docker exec mongodb-test mongosh VehicleDb --eval "db.User.insertOne({ _id: '1', Email: 'admin@example.com', PasswordHash: 'Admin123!', FullName: 'Admin', IsDeleted: false })"

      - name: Start API
        env:
          MONGODB_CONNECTION_STRING: mongodb://localhost:27018
          MONGODB_DATABASE_NAME: VehicleDb
        run: |
          Start-Process -NoNewWindow dotnet -ArgumentList "run", "--project", "VehicleManagement.Api/VehicleManagement.Api.csproj", "--urls", "http://0.0.0.0:5014" -RedirectStandardOutput api_stdout.log -RedirectStandardError api_stderr.log
          
      - name: Wait for API
        run: |
          $maxRetries = 120
          $retryCount = 0
          while ($retryCount -lt $maxRetries) {
              try {
                  $response = Invoke-WebRequest -Uri "http://localhost:5014/api/Auth/login" -Method POST -Body "{}" -ContentType "application/json" -UseBasicParsing
                  break
              } catch {
                  if ($null -ne $_.Exception.Response -and ($_.Exception.Response.StatusCode -eq 400 -or $_.Exception.Response.StatusCode -eq 401 -or $_.Exception.Response.StatusCode -eq 500)) {
                      Write-Host "API is up!"
                      break
                  }
                  Write-Host "Waiting for API..."
                  Start-Sleep -Seconds 2
                  $retryCount++
              }
          }
          if ($retryCount -eq $maxRetries) { 
              Write-Error "Timeout waiting for API"
              if (Test-Path api_stdout.log) { Get-Content api_stdout.log }
              if (Test-Path api_stderr.log) { Get-Content api_stderr.log }
              exit 1 
          }

      - name: Run JMeter Tests
        run: |
          (Get-Content run-performance-tests.ps1) -replace 'Start-Process \(Join-Path \$reportDir "index.html"\)', '' | Set-Content run-performance-tests.ps1
          .\run-performance-tests.ps1

      - name: Clean up MongoDB
        if: always()
        run: docker rm -f mongodb-test

      - name: Upload JMeter Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-jmeter-report
          path: jmeter/report/
          retention-days: 10

  deploy-pages:
    name: Deploy Reports to GitHub Pages
    runs-on: self-hosted
    needs: [build-and-unit-tests, performance-tests]
    if: always()
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Unit Test Coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: backend-coverage-html
          path: public/coverage
          
      - name: Download JMeter Report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: backend-jmeter-report
          path: public/jmeter
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          destination_dir: backend
          keep_files: true

